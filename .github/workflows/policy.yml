name: Policy Enforcement

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Single file enforcement
  policy-single-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check new source files
        run: |
          new_files=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD | grep -E '\.(py|ts|js|go|rs|java|cpp|c|h)$' || true)
          count=$(echo "$new_files" | grep -c '.' || echo 0)
          if [ "$count" -gt 3 ]; then
            echo "::error::Too many new source files ($count). Maximum allowed: 3."
            exit 1
          fi

  # Line count enforcement
  policy-line-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check file line counts
        run: |
          oversized=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | while read f; do
            lines=$(git show HEAD:"$f" 2>/dev/null | wc -l || echo 0)
            if [ "$lines" -gt 500 ]; then
              echo "$f ($lines lines)"
            fi
          done)
          if [ -n "$oversized" ]; then
            echo "::error::Files exceeding 500 lines:"
            echo "$oversized"
            exit 1
          fi

  # AGENTS.md size check
  policy-agents-md-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check AGENTS.md line count
        run: |
          if [ -f AGENTS.md ]; then
            lines=$(wc -l < AGENTS.md)
            if [ "$lines" -gt 200 ]; then
              echo "::error::AGENTS.md has $lines lines (limit: 200). Requires additional review."
              exit 1
            fi
          fi

  # Training time budget check
  policy-training-time-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for training scripts
        run: |
          # Check that any training scripts have timeout or max_time
          training_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '_train|fit|evaluate' || true)
          for f in $training_files; do
            if ! grep -qE '(timeout|max_time|max_wallclock|MAX_WALLCLOCK)' "$f" 2>/dev/null; then
              echo "::error::$f appears to be a training script but lacks time budget"
              exit 1
            fi
          done

  # Memory artifacts check
  policy-memory-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check memory file naming
        run: |
          # Check that new memory files follow naming convention
          memory_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '.claude/memory/' || true)
          bad_naming=$(echo "$memory_files" | grep -vE '[0-9]{8}_[0-9]{6}\.md$' || true)
          if [ -n "$bad_naming" ]; then
            echo "::warning::Memory files should be named YYYYMMDD_HHMMSS.md:"
            echo "$bad_naming"
          fi
